name: Verify GoBao Music Web

on:
  push:
    branches: [main]
    paths:
      - "web-demo/**"
      - ".github/workflows/verify-web.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: JavaScript syntax check
        run: |
          node --check web-demo/services.js
          node --check web-demo/app.js
          node --check web-demo/visual.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 4173 --directory web-demo > /tmp/gobao-web.log 2>&1 &
          sleep 2
      - name: Run click-through smoke test
        run: node web-demo/smoke.mjs
