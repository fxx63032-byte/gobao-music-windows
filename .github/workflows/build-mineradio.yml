name: Build GO宝音乐 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - replace/mineradio-2.2.0
    paths:
      - ".gitmodules"
      - "Mineradio"
      - ".github/workflows/build-mineradio.yml"
      - "branding/**"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with Mineradio
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned upstream
        shell: powershell
        run: |
          Set-Location Mineradio
          $sha = git rev-parse HEAD
          Write-Host "Mineradio upstream: $sha"
          if ($sha -ne "94025664d71a8e6cedbb8eca56309a10ca1e1562") { throw "Unexpected Mineradio commit: $sha" }

      - name: Apply GO宝音乐 branding
        shell: powershell
        run: .\branding\apply-gobao-branding.ps1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Mineradio/package-lock.json

      - name: Install Mineradio dependencies
        working-directory: Mineradio
        run: npm ci --no-audit --no-fund

      - name: Build GO宝音乐 Windows installer
        working-directory: Mineradio
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build:win -- --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GOBaoMusic-2.2.0-Windows
          path: |
            Mineradio/dist/*Setup.exe
            Mineradio/dist/*.yml
          if-no-files-found: error
          compression-level: 0


      - name: Generate installer checksum
        working-directory: Mineradio
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path dist -Filter "GOBaoMusic-*-Setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "GO宝音乐 Setup.exe not found" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "SHA256: $hash"

      - name: Publish direct EXE release
        working-directory: Mineradio
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "gobao-windows-v0.2.0"
          $exe = Get-ChildItem -Path dist -Filter "GOBaoMusic-*-Setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "GO宝音乐 Setup.exe not found" }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "$env:GITHUB_SHA" --title "GO宝音乐 Windows V0.2" --notes "GO宝音乐 Windows 安装版。可直接下载 EXE，无需解压 GitHub Actions Artifact。"
          }

          gh release upload $tag $exe.FullName "dist\SHA256SUMS.txt" --clobber
