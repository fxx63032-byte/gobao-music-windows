name: Build GO宝音乐 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - replace/mineradio-2.2.0
    paths:
      - ".gitmodules"
      - "Mineradio"
      - ".github/workflows/build-mineradio.yml"
      - "branding/**"
      - "gobao/**"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with Mineradio
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned upstream
        shell: pwsh
        run: |
          Set-Location Mineradio
          $sha = git rev-parse HEAD
          Write-Host "Mineradio upstream: $sha"
          if ($sha -ne "94025664d71a8e6cedbb8eca56309a10ca1e1562") { throw "Unexpected Mineradio commit: $sha" }

      - name: Apply GO宝音乐 branding
        shell: pwsh
        run: .\branding\apply-gobao-branding.ps1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Mineradio/package-lock.json

      - name: Install Mineradio dependencies
        working-directory: Mineradio
        run: npm ci --no-audit --no-fund

      - name: Apply and verify GO宝 dynamic library and QQ login fix
        run: |
          node gobao/apply.cjs
          node gobao/verify.cjs
          node gobao/verify-login.cjs

      - name: Windows Electron dynamic media smoke test
        run: .\Mineradio\node_modules\.bin\electron.cmd gobao/smoke.cjs

      - name: Build GO宝音乐 Windows installer
        working-directory: Mineradio
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build:win -- --publish never

      - name: Verify packaged dynamic media
        run: node gobao/verify.cjs Mineradio/dist/win-unpacked/resources/app/public

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: GOBaoMusic-dynamic-library-verification
          path: verification/
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GOBaoMusic-2.2.0-Windows
          path: |
            Mineradio/dist/*Setup.exe
            Mineradio/dist/*.yml
          if-no-files-found: error
          compression-level: 0


      - name: Generate installer checksum
        working-directory: Mineradio
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "GOBaoMusic-*-Setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "GO宝音乐 Setup.exe not found" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "SHA256: $hash"

      - name: Publish direct EXE release
        working-directory: Mineradio
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "gobao-windows-v0.2.6-" + $env:GITHUB_SHA.Substring(0, 7)
          $exe = Get-ChildItem -Path dist -Filter "GOBaoMusic-*-Setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "GO宝音乐 Setup.exe not found" }

          cmd /c "gh release view $tag --repo $env:GITHUB_REPOSITORY >nul 2>nul"
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "GO宝音乐 Windows V0.2.6" --notes "修复 QQ 登录旧彩蛋门禁残留：GO宝内置 QQ 官方登录窗口不再被旧门禁拦截，QQ Cookie 保存接口在旧状态明确未解锁时也会进入正常校验；界面明确说明不会读取外部 QQ音乐 Windows 客户端。保留六个动态视频背景素材。真人扫码授权仍需用户本人完成。"
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          }

          gh release upload $tag $exe.FullName "dist\SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
