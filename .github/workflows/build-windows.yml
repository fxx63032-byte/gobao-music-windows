name: Build GoBao Music Windows V0.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'web-demo/**'
      - 'docs/**'
      - 'README.md'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled FFmpeg
        shell: powershell
        run: ./scripts/download-ffmpeg.ps1

      - name: Verify JavaScript syntax
        run: npm run verify:syntax

      - name: Verify automatic audio decode
        run: npm run verify:audio

      - name: Build unpacked Windows app
        run: npx electron-builder --win dir

      - name: Verify unpacked executable exists
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path 'dist\win-unpacked' -Filter '*.exe' -File | Where-Object { $_.Name -ne 'ffmpeg.exe' -and $_.Name -ne 'ffprobe.exe' } | Select-Object -First 1
          if (-not $exe) { throw 'Main unpacked application EXE not found' }
          Write-Host "Found main application EXE: $($exe.FullName)"

      - name: Build installer and portable EXE
        run: npm run dist:win

      - name: Verify release EXEs exist
        shell: powershell
        run: |
          $exes = Get-ChildItem -Path dist -Filter '*.exe' -File
          if ($exes.Count -lt 2) { throw "Expected installer + portable EXE, found $($exes.Count)" }
          $exes | ForEach-Object { Write-Host "Release EXE: $($_.FullName)" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoBaoMusic-Windows-V0.4
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
