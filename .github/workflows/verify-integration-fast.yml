name: Fast Verify GoBao V0.3

on:
  push:
    branches:
      - feature/full-music-experience-integration
  workflow_dispatch:

jobs:
  fast-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/app.js
          node --check renderer/visual.js
          node --check renderer/integration.js
          node --check providers/provider-contract.js
          node --check providers/local-provider.js
          node --check providers/tme-music-cloud-provider.js
          node --check providers/tuned-global-provider.js
      - name: Provider load test
        run: |
          node -e "const {LocalMusicProvider}=require('./providers/local-provider'); const p=new LocalMusicProvider(); if(p.name!=='local') process.exit(1); console.log('FAST_VERIFY_OK')"
