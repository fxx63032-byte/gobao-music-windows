name: Verify GoBao Music V0.4

on:
  push:
    branches:
      - feature/v0.4-pro-audio-workerw-providers
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: npm run verify:syntax
      - name: Provider construction check
        run: |
          node - <<'NODE'
          const {TmeMusicCloudProvider}=require('./providers/tme-music-cloud-provider');
          const {TunedGlobalProvider}=require('./providers/tuned-global-provider');
          const t=new TmeMusicCloudProvider();
          const g=new TunedGlobalProvider();
          if(t.status().configured || g.status().configured) process.exit(1);
          console.log('PROVIDER_CONSTRUCTION_OK');
          NODE
      - name: Install renderer smoke dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve renderer
        run: |
          python3 -m http.server 4184 --directory renderer >/tmp/gobao-v04.log 2>&1 &
          sleep 2
      - name: Dual-deck renderer smoke
        run: node renderer/smoke-v0.4.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Parse WorkerW helper
        shell: powershell
        run: |
          $text = Get-Content -Raw scripts/workerw.ps1
          [void][scriptblock]::Create($text)
          Write-Host "WORKERW_SCRIPT_PARSE_OK"
      - name: Prepare bundled FFmpeg
        shell: powershell
        run: ./scripts/download-ffmpeg.ps1
      - name: Verify syntax and audio decode
        run: npm run verify
      - name: Build unpacked Windows V0.4
        run: npx electron-builder --win dir --publish never
      - name: Verify V0.4 resources
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path 'dist\win-unpacked' -Filter '*.exe' -File | Where-Object { $_.Name -ne 'ffmpeg.exe' -and $_.Name -ne 'ffprobe.exe' } | Select-Object -First 1
          if (-not $exe) { throw 'GoBao V0.4 main EXE not found' }
          $worker = Join-Path 'dist\win-unpacked\resources' 'workerw.ps1'
          if (-not (Test-Path $worker)) { throw 'Bundled workerw.ps1 not found' }
          Write-Host "GOBAO_V04_WINDOWS_BUILD_OK: $($exe.FullName)"
